<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LockLab</title>
<style>
:root{--bg:#F1F2F4;--card:#fff;--tx:#0B0C0E;--mu:#6C7078;--ln:#E1E3E7;--ac:#3E91FF;--r:28px;--f:"Samsung One","Roboto","Segoe UI",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-ui=ios]{--bg:#F2F2F7;--r:14px;--ln:#D8D8DD;--f:-apple-system,"SF Pro Display",system-ui,sans-serif}
:root:not([data-dk]){color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-dk]){--bg:#0A0A0B;--card:#1B1C1F;--tx:#F5F6F8;--mu:#9A9EA6;--ln:#2A2C31}}
:root[data-dk="1"]{--bg:#0A0A0B;--card:#1B1C1F;--tx:#F5F6F8;--mu:#9A9EA6;--ln:#2A2C31}
:root[data-dk="1"][data-ui=ios]{--bg:#000;--card:#1C1C1E;--ln:#38383A}
:root[data-ui=amoled]{--bg:#000;--card:#0E0E10;--ln:#222}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f)}
body{padding:0 16px calc(88px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto}
h1{font-size:36px;font-weight:800;letter-spacing:-.02em;margin:48px 0 4px}
h2{font-size:22px;font-weight:800;margin:20px 0 2px}
.mu{color:var(--mu);margin:0 0 10px;font-size:14px;line-height:1.4}
.card{background:var(--card);border-radius:var(--r);margin:12px 0;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ln);min-height:52px;font-size:15px}
.row:last-child{border:0}.col{flex-direction:column;align-items:stretch;gap:8px}
select,input[type=text],textarea{background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:10px;font:inherit;max-width:55%}
textarea{width:100%;max-width:100%;min-height:90px;font-size:12px}
input[type=range]{width:100%;accent-color:var(--ac);height:28px}
input[type=color]{width:44px;height:32px;border:0;background:none;padding:0}
input.sw{appearance:none;width:51px;height:31px;border-radius:99px;background:var(--ln);position:relative;flex:none;margin:0}
input.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:left .15s}
input.sw:checked{background:var(--ac)}input.sw:checked::after{left:22px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:99px;padding:12px 20px;font-weight:700;min-height:44px}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.chips,.seg{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips button,.seg button{flex:none;border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:10px 16px;min-height:44px;font-weight:600}
.chips .on,.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.seg{justify-content:center}.seg button{min-height:36px;padding:6px 12px;font-size:13px}
.pvw{margin-top:8px}
.scr{width:244px;height:430px;margin:10px auto;border-radius:38px;border:7px solid #000;overflow:hidden;position:relative;background:#000}
.in{position:absolute;inset:0;display:flex;flex-direction:column;color:#fff;padding:10px 12px;font-size:11px;font-family:system-ui}
.sb{display:flex;justify-content:space-between;font-weight:600}
.n{background:rgba(255,255,255,.2);border-radius:14px;padding:8px 10px;margin-top:6px}
.dot{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.3);display:inline-block;margin-right:6px}
.tl{display:grid;gap:8px;margin-top:10px;justify-items:center}.tl b{width:100%;max-width:44px;aspect-ratio:1;display:grid;place-items:center;font-weight:400;font-size:16px}
.ic{display:grid;gap:10px 4px;margin-top:10px;justify-items:center;text-align:center;font-size:9px}
.nv{margin-top:auto;display:flex;justify-content:space-around;align-items:center;min-height:18px;font-size:15px}.nv u{width:70px;border-radius:9px}
.kb{margin-top:auto;display:grid;gap:6px;padding-bottom:6px}.kb div{display:flex;gap:3px;justify-content:center}.kb i{flex:1;max-width:20px;display:grid;place-items:center;font-style:normal}
.tab{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab button{background:none;border:0;display:flex;flex-direction:column;align-items:center;min-width:64px;min-height:48px;font-size:12px;color:var(--mu);font-weight:600}
.tab button.on{color:var(--ac)}.tab span{font-size:20px;line-height:1.2}
.bar{height:14px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;font-weight:600}
#toast.show{opacity:1}
.sv-on *,.sv-on *::after{transition:none!important;animation:none!important}
@media(prefers-reduced-motion:reduce){*,*::after{transition:none!important;animation:none!important}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style></head><body>
<h1 id="ttl">LockLab</h1><p class="mu" id="sub"></p>
<div id="app"></div><div id="toast"></div>
<nav class="tab"></nav>
<script>
const $=q=>document.querySelector(q);
const st=(k,v)=>{try{return v===undefined?JSON.parse(localStorage.getItem(k)):localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const M=[
['lockstar','LockStar','Lock screen layout','lock',[['clockPos','Clock position','sel',['Top','Center','Bottom'],'Top'],['clock24','24-hour clock','tog',0,0],['notifs','Notifications','sel',['Cards','Icons','Hidden'],'Cards'],['shortcuts','Shortcuts','tog',0,1]]],
['clockface','ClockFace','Clock style','lock',[['font','Font','sel',['Sans','Serif','Mono','Rounded'],'Sans'],['clockSize','Size','rng',[28,96],64],['clockColor','Color','col',0,'#ffffff']]],
['quickstar','QuickStar','Quick panel','qs',[['tileCols','Tile columns','rng',[2,5],4],['tileShape','Tile shape','sel',['Circle','Squircle','Square'],'Circle'],['qsBright','Brightness bar','tog',0,1]]],
['homeup','Home Up','Home screen grid','home',[['gridCols','Columns','rng',[3,6],4],['iconSize','Icon size','rng',[24,56],44],['iconRadius','Icon roundness','rng',[0,50],30],['labels','Icon labels','tog',0,1]]],
['navstar','NavStar','Navigation bar','home',[['nav','Style','sel',['Gesture bar','3 buttons','Hidden'],'Gesture bar'],['navColor','Color','col',0,'#ffffff'],['navHeight','Bar thickness','rng',[2,10],4]]],
['keys','Keys Cafe','Keyboard','keys',[['keyRadius','Key roundness','rng',[0,16],8],['keyH','Key height','rng',[22,44],32],['keyColor','Key color','col',0,'#3a3a40'],['haptic','Key vibration','tog',0,1]]],
['theme','Theme Park','Colors and wallpaper','home',[['accent','Accent','col',0,'#3e91ff'],['wall','Wallpaper','sel',['Aurora','Sunset','Ocean','Black'],'Aurora']]],
['sound','SoundAssistant','Volume and audio','sound',[['volSteps','Volume steps','rng',[15,30],30],['eq','Sound preset','sel',['Flat','Bass boost','Vocal','Treble'],'Flat'],['perApp','Per-app volume','tog',0,0]]],
['edge','Edge lighting','Notification glow','lock',[['edgeOn','Edge glow','tog',0,1],['edgeColor','Glow color','col',0,'#3e91ff'],['edgeWidth','Glow width','rng',[1,8],3]]],
['nice','NiceCatch','Status bar and alerts','lock',[['statusCenter','Center the clock','tog',0,0],['batPct','Battery percentage','tog',0,1],['alertVibe','Alert vibration','sel',['Soft','Medium','Strong'],'Medium']]],
['onehand','One Hand+','Gestures','home',[['edgeSwipe','Edge swipe','tog',0,1],['swipeAct','Swipe action','sel',['Back','Home','Recents','Screenshot'],'Back'],['dblTap','Double tap to sleep','tog',0,1]]],
['camera','Camera Assistant','Camera options','cam',[['grid','Grid lines','tog',0,1],['hdr','Auto HDR','tog',0,1],['shutter','Shutter sound','tog',0,0]]],
['multistar','MultiStar','Multi-window','home',[['splitAny','Split any app','tog',0,1],['popup','Pop-up windows','tog',0,0]]],
['routines','Routines+','Automations','lock',[['r1','Bedtime: dark mode and Do Not Disturb at 22:00','tog',0,0],['r2','Home Wi-Fi: turn off mobile data','tog',0,0],['r3','Charging: keep screen awake','tog',0,0]]]];
const PR={'Clean minimal':{clockPos:'Center',clockSize:72,notifs:'Icons',tileShape:'Circle',gridCols:4,iconRadius:50,labels:0,wall:'Black'},
'Bold neon':{clockPos:'Top',clockSize:88,font:'Rounded',clockColor:'#39ff88',accent:'#ff2fb3',wall:'Sunset',iconRadius:30,edgeOn:1,edgeColor:'#39ff88',edgeWidth:5},
'Battery max':{wall:'Black',edgeOn:0,haptic:0,qsBright:0,labels:0,perApp:0}};
const D={};M.forEach(m=>m[4].forEach(c=>D[c[0]]=c[4]));
let s={...D,...(st('ll_cur')||{})},base=st('ll_base')||JSON.stringify(s);
let ap={ui:'oneui',dk:null,sv:'auto',ac:'#3E91FF',...(st('ll_ap')||{})};
let mod='lockstar',view='lock',tab='studio',bat={lvl:null,chg:null};
const sw=()=>ap.sv=='on'||(ap.sv=='auto'&&bat.lvl!=null&&bat.lvl<=.2&&!bat.chg);
function theme(){const r=document.documentElement,x=sw();r.dataset.ui=x?'amoled':ap.ui;
 const dk=x||ap.ui=='amoled'||(ap.dk==null?matchMedia('(prefers-color-scheme:dark)').matches:ap.dk);
 r.dataset.dk=dk?1:0;r.style.setProperty('--ac',ap.ac);document.body.classList.toggle('sv-on',x)}
const lum=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/255000};
const clk=()=>{const d=new Date(),h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');return s.clock24?String(h).padStart(2,'0')+':'+m:((h%12)||12)+':'+m};
const bl=()=>bat.lvl!=null?Math.round(bat.lvl*100):82;
const W={Aurora:'linear-gradient(160deg,#0f2a5c,#6a2bd9 55%,#16c5a8)',Sunset:'linear-gradient(160deg,#2b1055,#d4416a 60%,#ffb347)',Ocean:'linear-gradient(160deg,#021b3a,#0a6fb8 60%,#5fe0ff)',Black:'#000'};
const FN={Sans:'system-ui',Serif:'Georgia,serif',Mono:'ui-monospace,monospace',Rounded:'"Arial Rounded MT Bold",Nunito,system-ui'};
const nv=()=>s.nav=='Hidden'?'<div class=nv></div>':s.nav=='3 buttons'?`<div class=nv style="color:${s.navColor}"><i>◁</i><i>○</i><i>□</i></div>`:`<div class=nv><u style="background:${s.navColor};height:${s.navHeight}px"></u></div>`;
const sb=()=>`<div class=sb><span>${s.statusCenter?'':clk()}</span><span>${s.statusCenter?clk():''}</span><span>${s.batPct?bl()+'% ':''}▮</span></div>`;
const shp=()=>({Circle:'50%',Squircle:'32%',Square:'8px'})[s.tileShape];
const V={
lock:()=>`${sb()}<div style="margin-top:${{Top:26,Center:80,Bottom:150}[s.clockPos]}px;text-align:center"><div style="font:${s.clockSize>60?800:600} ${s.clockSize*.8}px/1 ${FN[s.font]};color:${s.clockColor}">${clk()}</div><div>${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div></div>
${s.notifs=='Cards'?'<div class=n><b>Messages</b><br>Dinner at 8?</div><div class=n><b>Calendar</b><br>Standup in 10 min</div>':s.notifs=='Icons'?'<div style="margin-top:12px;text-align:center"><i class=dot></i><i class=dot></i><i class=dot></i></div>':''}
<div style="margin-top:auto;display:flex;justify-content:space-between;font-size:20px;visibility:${s.shortcuts?'visible':'hidden'}"><i class=dot style="width:36px;height:36px"></i><i class=dot style="width:36px;height:36px"></i></div>`,
qs:()=>`${sb()}<div style="margin-top:10px;font:700 26px system-ui">${clk()}</div><div class=tl style="grid-template-columns:repeat(${s.tileCols},1fr)">${['📶','🔵','🔦','✈️','🌙','🔋','⚡','🔔','📍','🔄'].slice(0,s.tileCols*2).map((t,i)=>`<b style="border-radius:${shp()};background:${i<2?s.accent:'rgba(255,255,255,.2)'}">${t}</b>`).join('')}</div>${s.qsBright?`<div class=bar style="margin-top:14px;height:30px;border-radius:15px"><i style="width:60%;background:${s.accent}"></i></div>`:''}`,
home:()=>`${sb()}<div class=ic style="grid-template-columns:repeat(${s.gridCols},1fr)">${Array.from({length:s.gridCols*4},(_,i)=>`<div><div style="width:${s.iconSize*.7}px;max-width:100%;aspect-ratio:1;border-radius:${s.iconRadius}%;background:hsl(${i*47},70%,55%);margin:auto"></div>${s.labels?'App':''}</div>`).join('')}</div>${nv()}`,
keys:()=>`${sb()}<div style="margin-top:20px">Type a message${s.haptic?' (vibrates)':''}</div><div class=kb>${['qwertyuiop','asdfghjkl','zxcvbnm'].map(r=>`<div>${[...r].map(k=>`<i style="height:${s.keyH*.9}px;border-radius:${s.keyRadius}px;background:${s.keyColor};color:${lum(s.keyColor)>.5?'#000':'#fff'}">${k}</i>`).join('')}</div>`).join('')}</div>${nv()}`,
sound:()=>`${sb()}<div style="margin-top:40px"><b>Media volume</b><div style="display:flex;gap:2px;margin:10px 0;height:40px">${Array.from({length:+s.volSteps},(_,i)=>`<i style="flex:1;border-radius:3px;background:${i<s.volSteps*.6?s.accent:'rgba(255,255,255,.25)'}"></i>`).join('')}</div>Preset: ${s.eq}<br>${s.perApp?'Per-app volume on':'Per-app volume off'}</div>`,
cam:()=>`${sb()}<div style="flex:1;margin:10px 0;border:1px solid #fff5;position:relative;background:linear-gradient(#123,#356)">${s.grid?'<i style="position:absolute;left:33%;top:0;bottom:0;border-left:1px solid #fff6"></i><i style="position:absolute;left:66%;top:0;bottom:0;border-left:1px solid #fff6"></i><i style="position:absolute;top:33%;left:0;right:0;border-top:1px solid #fff6"></i><i style="position:absolute;top:66%;left:0;right:0;border-top:1px solid #fff6"></i>':''}${s.hdr?'<b style="position:absolute;top:6px;left:6px">HDR</b>':''}</div><div style="text-align:center;font-size:30px">◉</div>${nv()}`};
function pvu(){const e=$('#scr');if(!e)return;const x=sw();
 e.innerHTML=`<div class=in style="background:${x?W.Black:W[s.wall]};box-shadow:${view=='lock'&&s.edgeOn?`inset 0 0 ${s.edgeWidth*5}px ${s.edgeWidth}px ${s.edgeColor}`:'none'}">${V[view]()}</div>`}
function ctl(c){const [k,l,t,a]=c,v=s[k];
 if(t=='tog')return`<label class=row><span>${l}</span><input class=sw type=checkbox data-k=${k} ${v?'checked':''}></label>`;
 if(t=='sel')return`<label class=row><span>${l}</span><select data-k=${k}>${a.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select></label>`;
 if(t=='rng')return`<label class="row col"><span>${l}: <b>${v}</b></span><input type=range data-k=${k} min=${a[0]} max=${a[1]} value=${v}></label>`;
 return`<label class=row><span>${l}</span><input type=color data-k=${k} value=${v}></label>`}
const studio=()=>{const m=M.find(x=>x[0]==mod);
 return`<div class=pvw><div class=seg>${[['lock','Lock'],['qs','Quick'],['home','Home'],['keys','Keys'],['sound','Sound'],['cam','Camera']].map(v=>`<button data-v=${v[0]} class="${view==v[0]?'on':''}">${v[1]}</button>`).join('')}</div><div class=scr id=scr></div></div>
<div class=chips>${M.map(x=>`<button data-m=${x[0]} class="${mod==x[0]?'on':''}">${x[1]}</button>`).join('')}</div>
<h2>${m[1]}</h2><p class=mu>${m[2]}</p><div class=card>${m[4].map(ctl).join('')}</div>
<div class=card><div class=row><span id=dirty>${JSON.stringify(s)!=base?'Unsaved changes':'All changes saved'}</span><button class="btn g" data-a=rev>Undo changes</button></div>
<div class=row><input type=text id=pn placeholder="Setting name" style="flex:1;max-width:none"><button class=btn data-a=save>Save setting</button></div></div>`};
const prof=()=>{const P=st('ll_prof')||[];
 return`<h2>Saved settings</h2><p class=mu>Load any saved setting later to change or restore it.</p><div class=card>${P.length?P.map((p,i)=>`<div class=row><span>${p.n}<br><small class=mu>${new Date(p.d).toLocaleDateString()}</small></span><span><button class="btn g" data-a=load data-i=${i}>Load</button> <button class="btn g" data-a=del data-i=${i}>Delete</button></span></div>`).join(''):'<div class=row><span class=mu>No saved settings yet. Save one from Studio.</span></div>'}</div>
<h2>Presets</h2><div class=chips>${Object.keys(PR).map(n=>`<button data-a=pre data-n="${n}">${n}</button>`).join('')}<button data-a=reset>Reset to default</button></div>
<h2>Backup</h2><div class=card><div class=row col style="flex-direction:column;align-items:stretch"><textarea id=io placeholder="Paste a backup here to import"></textarea><div><button class="btn g" data-a=exp>Export all</button> <button class=btn data-a=imp>Import</button></div></div></div>`};
const batt=()=>`<h2>Battery</h2><div class=card><div class="row col"><span>${bat.lvl==null?'Battery level is not available in this browser.':`${bl()}% ${bat.chg?'· Charging':''}`}</span><div class=bar><i style="width:${bl()}%"></i></div></div>
<label class=row><span>Battery saver</span><select data-ap=sv>${[['auto','Auto at 20%'],['on','Always on'],['off','Off']].map(o=>`<option value=${o[0]} ${ap.sv==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label></div>
<p class=mu>${sw()?'Saver is active: ':'When active: '}pure black screens, no animations, and the preview clock refreshes only while this app is visible. No background work or network calls ever run; everything is stored on this device.</p>`;
const look=()=>`<h2>App look</h2><div class=card><label class=row><span>Style</span><select data-ap=ui>${[['oneui','One UI bold'],['ios','iOS bold'],['amoled','AMOLED black']].map(o=>`<option value=${o[0]} ${ap.ui==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>
<label class=row><span>Mode</span><select data-ap=dk>${[['sys','Follow system'],['light','Light'],['dark','Dark']].map(o=>`<option value=${o[0]} ${(ap.dk==null?'sys':ap.dk?'dark':'light')==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label>
<label class=row><span>App accent</span><input type=color data-ap=ac value="${ap.ac}"></label></div>
<p class=mu>LockLab is inspired by Samsung Good Lock and is not made by Samsung. Browsers cannot change your phone's real launcher or system UI, so this app previews your design and saves it. Use Add to Home Screen to install it on any phone or tablet.</p>`;
const TT={studio:['LockLab','Design your phone, preview it live, save it.'],prof:['Settings',''],bat:['Battery',''],look:['Look','']};
function render(){$('#ttl').textContent=TT[tab][0];$('#sub').textContent=TT[tab][1];
 $('#app').innerHTML={studio,prof,bat:batt,look}[tab]();
 $('.tab').innerHTML=[['studio','◧','Studio'],['prof','☰','Saved'],['bat','⚡','Battery'],['look','◐','Look']].map(t=>`<button data-t=${t[0]} class="${tab==t[0]?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('');pvu()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
const save=()=>{st('ll_cur',s)};
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k,a=t.dataset.ap;
 if(k){s[k]=t.type=='checkbox'?+t.checked:t.type=='range'?+t.value:t.value;save();
  if(t.type=='range')t.closest('label').querySelector('b').textContent=t.value;pvu();
  const d=$('#dirty');if(d)d.textContent=JSON.stringify(s)!=base?'Unsaved changes':'All changes saved'}
 if(a){ap[a]=a=='dk'?{sys:null,light:0,dark:1}[t.value]:t.value;st('ll_ap',ap);theme();if(a!='ac')render();pvu()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-v],[data-m],[data-a]');if(!t)return;const d=t.dataset,P=st('ll_prof')||[];
 if(d.t){tab=d.t;render();scrollTo(0,0);return}
 if(d.v){view=d.v;render();return}
 if(d.m){mod=d.m;view=M.find(x=>x[0]==mod)[3];render();return}
 if(d.a=='save'){const n=($('#pn').value||'').trim()||'Setting '+(P.length+1);P.unshift({n,d:Date.now(),s:{...s}});st('ll_prof',P);base=JSON.stringify(s);st('ll_base',base);toast('Setting saved')}
 if(d.a=='load'){s={...D,...P[d.i].s};base=JSON.stringify(s);st('ll_base',base);save();toast('Setting loaded');tab='studio'}
 if(d.a=='del'){P.splice(d.i,1);st('ll_prof',P);toast('Setting deleted')}
 if(d.a=='rev'){try{s={...D,...JSON.parse(base)}}catch(x){s={...D}}save();toast('Changes undone')}
 if(d.a=='pre'){s={...s,...PR[d.n]};save();toast(d.n+' applied');tab='studio'}
 if(d.a=='reset'){s={...D};save();toast('Reset to default')}
 if(d.a=='exp'){const j=JSON.stringify(P);$('#io').value=j;try{navigator.clipboard.writeText(j)}catch(x){}toast('Backup ready');return}
